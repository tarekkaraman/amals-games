<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0b3d" />
  <title>Stats & Leaderboards · Amal's Games</title>
  <script src="../shared/arcade.js"></script>
  <script src="../shared/sound.js"></script>
  <style>
    :root { --bg1:#120a2e; --bg2:#2a1468; --ink:#fff; --muted:#b9b4e3; --sun:#ffd23f; --coral:#ff5d8f; --mint:#3fe0a8; --sky:#4cc9f0; --card:rgba(255,255,255,.08); --edge:rgba(255,255,255,.16); --shadow:0 16px 40px rgba(0,0,0,.35); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"SF Pro Rounded", ui-rounded, "Segoe UI", system-ui, sans-serif; color:var(--ink); min-height:100vh; overflow-x:hidden; -webkit-tap-highlight-color:transparent;
      background: radial-gradient(120% 90% at 20% 0%, var(--bg2), transparent 60%), radial-gradient(90% 80% at 100% 100%, #0b3b5e, transparent 60%), var(--bg1); background-attachment:fixed; }
    .wrap { max-width:1000px; margin:0 auto; padding:clamp(16px,4vw,36px) max(18px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left)); }
    .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .top > div { flex:1 1 260px; min-width:0; }
    .home { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:10px 18px; border-radius:999px; background:var(--card); border:2px solid var(--edge); color:#fff; text-decoration:none; font-weight:900; white-space:nowrap; }
    h1 { font-size:clamp(1.7rem,7vw,3.2rem); font-weight:900; line-height:1.05; } h1 span { background:linear-gradient(90deg,var(--sun),var(--coral)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .sub { color:var(--muted); font-weight:700; margin-top:6px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 16px; }
    .tab { min-height:44px; padding:8px 16px; border-radius:999px; font-weight:900; background:var(--card); border:2px solid var(--edge); color:#e9e4ff; cursor:pointer; font-family:inherit; font-size:1rem; }
    .tab.on { background:#fff; color:#2a1468; border-color:#fff; }
    .panel { background:var(--card); border:2px solid var(--edge); border-radius:24px; padding:18px; box-shadow:var(--shadow); margin-top:14px; min-width:0; }
    .panel h2 { font-size:1.25rem; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
    .pcard { background:rgba(0,0,0,.25); border:2px solid var(--edge); border-radius:18px; padding:12px; display:flex; gap:10px; align-items:center; min-width:0; }
    .pcard .av { font-size:2.2rem; } .pcard b { display:block; font-size:1.05rem; } .pcard small { color:var(--muted); font-weight:700; display:block; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:rgba(0,0,0,.22); margin-bottom:6px; min-width:0; }
    .row.me { box-shadow:inset 0 0 0 2px var(--sun); }
    .row .rank { font-weight:900; width:34px; flex:0 0 34px; font-size:1.2rem; }
    .row .who { flex:1 1 auto; min-width:0; font-weight:800; display:flex; align-items:center; gap:8px; }
    .row .who .arc-av { flex:0 0 auto; } .row .who .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row .sc { font-weight:900; color:var(--sun); font-variant-numeric:tabular-nums; white-space:nowrap; } .row small { color:var(--muted); font-weight:700; white-space:nowrap; }
    .row .right { flex:0 0 auto; text-align:right; display:flex; flex-direction:column; align-items:flex-end; line-height:1.2; }
    .feed .row { font-size:.95rem; } .feed .row .who { display:block; } .feed .row .who .arc-av { vertical-align:middle; }
    @media (max-width:480px) { .row { padding:8px 10px; } .row .rank { width:28px; flex-basis:28px; font-size:1.05rem; } .panel { padding:14px; border-radius:18px; } }
    .empty { color:var(--muted); font-weight:700; padding:10px; text-align:center; }
    .comment { background:rgba(0,0,0,.22); border-radius:14px; padding:10px 12px; margin-bottom:8px; }
    .comment .h { display:flex; justify-content:space-between; gap:8px; font-weight:900; } .comment .h small { color:var(--muted); font-weight:700; }
    .comment p { margin:4px 0 6px; line-height:1.4; } .reacts { display:flex; gap:6px; flex-wrap:wrap; }
    .reacts button { font:inherit; font-size:.85rem; min-height:36px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.08); border:2px solid var(--edge); color:#fff; cursor:pointer; font-weight:800; }
    .reacts button.on { border-color:var(--mint); }
    .cbox { display:flex; gap:8px; margin-top:8px; } .cbox input { flex:1; min-width:0; font:inherit; font-size:16px; color:#fff; background:rgba(0,0,0,.3); border:2px solid var(--edge); border-radius:12px; padding:10px 12px; outline:none; }
    .btn { font:inherit; font-weight:900; min-height:44px; padding:10px 18px; border-radius:999px; border:none; cursor:pointer; color:#2a1468; background:linear-gradient(180deg,#ffe066,#ffb703); box-shadow:0 4px 0 #c98a00; } .btn:active { transform:translateY(2px); }
    .gsel { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; } .gsel button { font:inherit; font-weight:800; min-height:44px; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.07); border:2px solid var(--edge); color:#fff; cursor:pointer; } .gsel button.on { background:var(--sun); color:#2a1468; border-color:var(--sun); }
    .comment .h a { min-height:0; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:6px; } .kpi { background:rgba(0,0,0,.25); border-radius:14px; padding:12px; text-align:center; } .kpi b { display:block; font-size:1.6rem; color:var(--sun); } .kpi small { color:var(--muted); font-weight:800; }
    .danger { background:none; border:2px solid rgba(255,93,143,.6); color:#ffb3c8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="home" href="../">🏠 Amal's Games</a>
      <div><h1><span>Stats</span> & Leaderboards 🏆</h1><div class="sub">Who's been playing, who's winning, and what everyone thinks.</div></div>
      <span id="chip" style="margin-left:auto"></span>
    </div>
    <div class="tabs"><button class="tab on" data-t="boards">🏆 Leaderboards</button><button class="tab" data-t="players">👥 Players</button><button class="tab" data-t="feed">🕒 Activity</button></div>
    <div id="view"></div>
  </div>
  <script>
    Arcade.require(false);
    document.getElementById('chip').appendChild(Arcade.chip());
    Sound.wire();
    const V = document.getElementById('view'); let tab = 'boards'; let game = 'dubai-dash';
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => { document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on')); b.classList.add('on'); tab = b.dataset.t; render(); }));
    document.addEventListener('arcade:profile', render);

    function render() {
      const me = Arcade.profile();
      if (tab === 'boards') {
        const G = Arcade.GAMES; const board = Arcade.leaderboard(game); const cs = Arcade.comments(game); const ideas = Arcade.ideas();
        const r = ideas.ratings[game] || {}; const vals = Object.values(r).filter((v) => typeof v === 'number'); const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : null;
        V.innerHTML = `<div class="panel"><div class="gsel">${Object.entries(G).map(([id, g]) => `<button class="${id === game ? 'on' : ''}" data-g="${id}">${g.emoji} ${g.name}</button>`).join('')}</div>
          <h2>${G[game].emoji} ${G[game].name} ${avg ? `<small style="color:var(--muted);font-size:.9rem">· rated ${avg} ⭐ by ${vals.length}</small>` : ''}</h2>
          ${board.length ? board.map((b, i) => `<div class="row ${b.player === me ? 'me' : ''}"><span class="rank">${['🥇','🥈','🥉'][i] || (i + 1)}</span><span class="who">${Arcade.avatar(b.player, 28)}<span class="nm">${esc(b.player)}</span></span><span class="right"><span class="sc">${b.score.toLocaleString()} ${G[game].unit}</span><small>${Arcade.ago(b.ts)}</small></span></div>`).join('') : '<div class="empty">No scores yet — be the first! 🚀</div>'}
          <h2 style="margin-top:16px">💬 Comments</h2>
          <div id="comments">${cs.length ? cs.map((c) => `<div class="comment"><div class="h"><span>${Arcade.avatar(c.player, 24)} ${esc(c.player)}</span><small>${Arcade.ago(c.ts)}${c.player === me ? ` · <a href="#" data-del="${c.id}" style="color:#ffb3c8">delete</a>` : ''}</small></div><p>${esc(c.text)}</p>
            <div class="reacts">${['🔥','😂','👏','💜','🏆'].map((e) => { const who = (c.reacts && c.reacts[e]) || []; return `<button class="${who.includes(me) ? 'on' : ''}" data-react="${c.id}" data-e="${e}">${e} ${who.length || ''}</button>`; }).join('')}</div></div>`).join('') : '<div class="empty">No comments yet. Say something nice (or a bit cheeky) 😄</div>'}</div>
          <div class="cbox"><input id="ctext" maxlength="140" placeholder="Leave a comment as ${esc(me)}…" /><button class="btn" id="csend">Post</button></div></div>`;
        V.querySelectorAll('[data-g]').forEach((b) => b.addEventListener('click', () => { game = b.dataset.g; render(); }));
        V.querySelectorAll('[data-react]').forEach((b) => b.addEventListener('click', () => { Arcade.react(+b.dataset.react, b.dataset.e); render(); }));
        V.querySelectorAll('[data-del]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); if (confirm('Delete your comment?')) { Arcade.deleteComment(+a.dataset.del); render(); } }));
        const send = () => { const t = V.querySelector('#ctext').value.trim(); if (!t) return; Arcade.comment(game, t); Sound.success(); render(); };
        V.querySelector('#csend').addEventListener('click', send); V.querySelector('#ctext').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
      } else if (tab === 'players') {
        const act = Arcade.activity(); const G = Arcade.GAMES;
        V.innerHTML = `<div class="panel"><h2>👥 Everyone</h2><div class="grid">${Arcade.PROFILES.map((p) => {
          const mine = act.filter((e) => e.player === p.name); const finishes = mine.filter((e) => e.type === 'finish'); const last = mine[0];
          const fav = Object.entries(finishes.reduce((m, e) => (m[e.game] = (m[e.game] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1])[0];
          const golds = Object.keys(G).filter((g) => (Arcade.leaderboard(g)[0] || {}).player === p.name).length;
          return `<div class="pcard"><span class="av">${p.emoji}</span><div><b>${p.name}${p.name === Arcade.profile() ? ' (you)' : ''}</b><small>${finishes.length} games played · ${golds} 🥇</small><small>${fav ? 'Favourite: ' + G[fav[0]].emoji + ' ' + G[fav[0]].name : 'Not played yet'}</small><small>${last ? 'Last seen ' + Arcade.ago(last.ts) : ''}</small></div></div>`; }).join('')}</div></div>
          <div class="panel"><h2>🧹 Housekeeping</h2><p class="sub" style="margin-bottom:10px">Only use these if you really mean it.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" id="resetMe">Reset ${esc(Arcade.profile())}'s game progress</button><button class="btn danger" id="resetAct">Clear activity & leaderboards</button></div></div>`;
        V.querySelector('#resetMe').addEventListener('click', () => { const me = Arcade.profile(); if (!confirm(`Reset ALL of ${me}'s saved game progress on this device?`)) return; const ks = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.endsWith('::' + me)) ks.push(k); } ks.forEach((k) => localStorage.removeItem(k)); alert(`Done — ${ks.length} saves cleared.`); });
        V.querySelector('#resetAct').addEventListener('click', () => { if (confirm('Clear the whole activity log, leaderboards and comments?')) { localStorage.removeItem('amals-activity-v1'); localStorage.removeItem('amals-comments-v1'); render(); } });
      } else {
        const act = Arcade.activity().slice(0, 80); const G = Arcade.GAMES;
        const txt = (e) => e.type === 'finish' ? `scored <b style="color:var(--sun)">${e.score.toLocaleString()} ${G[e.game] ? G[e.game].unit : ''}</b> in ${G[e.game] ? G[e.game].emoji + ' ' + G[e.game].name : e.game}` : e.type === 'start' ? `started playing ${G[e.game] ? G[e.game].emoji + ' ' + G[e.game].name : e.game}` : e.type === 'rate' ? `rated ${G[e.game] ? G[e.game].name : e.game} ${'⭐'.repeat(e.score)}` : e.type === 'comment' ? `commented on ${G[e.game] ? G[e.game].name : e.game}` : e.type === 'idea' ? `added an idea: <i>${esc(e.extra || '')}</i>` : e.type;
        const today = act.filter((e) => Date.now() - e.ts < 86400000);
        V.innerHTML = `<div class="panel"><div class="kpis"><div class="kpi"><b>${act.filter((e) => e.type === 'finish').length}</b><small>games finished</small></div><div class="kpi"><b>${new Set(today.map((e) => e.player)).size}</b><small>players today</small></div><div class="kpi"><b>${Arcade.comments().length}</b><small>comments</small></div><div class="kpi"><b>${Arcade.ideas().ideas.length}</b><small>ideas</small></div></div>
          <h2>🕒 Latest activity</h2><div class="feed">${act.length ? act.map((e) => `<div class="row"><span class="who">${Arcade.avatar(e.player, 24)} ${esc(e.player)} <span style="font-weight:700;color:#e9e4ff">${txt(e)}</span></span><small>${Arcade.ago(e.ts)}</small></div>`).join('') : '<div class="empty">Nothing yet — go play something!</div>'}</div></div>`;
      }
    }
    render();
  </script>
</body>
</html>
